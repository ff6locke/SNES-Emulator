name: Unzip and Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Extract Project ZIP
      run: unzip SNESPocket-Android-Project.zip -d . 

    - name: Upgrade Gradle Wrapper to 8.9
      run: |
        cd project/SNESPocket
        ./gradlew wrapper --gradle-version 8.9 --distribution-type all

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Grant Execute Permission to Gradlew
      run: chmod +x project/SNESPocket/gradlew

    - name: Build Debug APK
      run: |
        cd project/SNESPocket
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        path: "**/build/outputs/apk/debug/*.apk" # Changed to wildcard to ensure it catches the generated APK regardless of name adjustments
