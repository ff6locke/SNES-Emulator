name: Build SNES Pocket Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "snesandroidpocket.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download repository files
      - name: Check out repository
        uses: actions/checkout@v4

      # Step 2: Extract the ZIP stored in the main branch
      - name: Extract Android project
        shell: bash
        run: |
          if [ ! -f "snesandroidpocket.zip" ]; then
            echo "ERROR: snesandroidpocket.zip not found in repository root."
            exit 1
          fi

          mkdir -p extracted
          unzip -o snesandroidpocket.zip -d extracted

          PROJECT_DIR="extracted/SNESPocket"

          if [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle.kts not found in $PROJECT_DIR"
            find extracted -name settings.gradle.kts
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle.kts not found in $PROJECT_DIR"
            exit 1
          fi

          echo "Project directory: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # Step 3: Install Java 17
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Step 4: Install Android SDK packages
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      # Step 5: Install Gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Step 6: Fix Java and Kotlin JVM targets
      
      - name: Fix JVM target compatibility
        shell: bash
        run: |
          cat >> "$PROJECT_DIR/app/build.gradle.kts" <<'EOF'

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

          echo "Updated Java and Kotlin targets to JVM 17"
      - name: Integrate LibretroDroid, SNES9x core, game picker and controls
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("extracted/SNESPocket")
          settings = root / "settings.gradle.kts"
          app_gradle = root / "app/build.gradle.kts"

          s = settings.read_text()
          if "jitpack.io" not in s:
              marker = "dependencyResolutionManagement {"
              if marker not in s:
                  raise SystemExit("Could not find dependencyResolutionManagement in settings.gradle.kts")
              before, after = s.split(marker, 1)
              old_repos = "repositories { google(); mavenCentral() }"
              if old_repos not in after:
                  raise SystemExit("Could not find dependency repositories in settings.gradle.kts")
              after = after.replace(
                  old_repos,
                  'repositories { google(); mavenCentral(); maven { url = uri("https://jitpack.io") } }',
                  1
              )
              settings.write_text(before + marker + after)

          g = app_gradle.read_text()
          deps = [
              '    implementation("com.github.Swordfish90:libretrodroid:0.13.2")',
              '    implementation("androidx.activity:activity-ktx:1.9.3")'
          ]
          for dep in deps:
              if dep not in g:
                  match = re.search(r"dependencies\s*\{", g)
                  if match:
                      pos = match.end()
                      g = g[:pos] + "\n" + dep + g[pos:]
                  else:
                      g += "\ndependencies {\n" + dep + "\n}\n"
          app_gradle.write_text(g)

          # Add Android TV / Google TV launcher support.
          import xml.etree.ElementTree as ET
          manifests = list((root / "app/src/main").rglob("AndroidManifest.xml"))
          if manifests:
              manifest = manifests[0]
              ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
              tree = ET.parse(manifest)
              mroot = tree.getroot()
              android_ns = "{http://schemas.android.com/apk/res/android}"
              features = {e.get(android_ns + "name") for e in mroot.findall("uses-feature")}
              if "android.software.leanback" not in features:
                  ET.SubElement(mroot, "uses-feature", {android_ns + "name": "android.software.leanback", android_ns + "required": "false"})
              if "android.hardware.touchscreen" not in features:
                  ET.SubElement(mroot, "uses-feature", {android_ns + "name": "android.hardware.touchscreen", android_ns + "required": "false"})
              for activity in mroot.findall("application/activity") + mroot.findall("application/activity-alias"):
                  for intent_filter in activity.findall("intent-filter"):
                      actions = {x.get(android_ns + "name") for x in intent_filter.findall("action")}
                      categories = {x.get(android_ns + "name") for x in intent_filter.findall("category")}
                      if "android.intent.action.MAIN" in actions and "android.intent.category.LAUNCHER" in categories:
                          if "android.intent.category.LEANBACK_LAUNCHER" not in categories:
                              ET.SubElement(intent_filter, "category", {android_ns + "name": "android.intent.category.LEANBACK_LAUNCHER"})
              tree.write(manifest, encoding="utf-8", xml_declaration=True)
          PY

          MAIN="$PROJECT_DIR/app/src/main/java/com/example/snespocket/MainActivity.kt"
          mkdir -p "$(dirname "$MAIN")"
          cat > "$MAIN" <<'KOTLIN'
          package com.example.snespocket

          import android.content.Intent
          import android.database.Cursor
          import android.graphics.Color
          import android.graphics.Typeface
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.OpenableColumns
          import android.view.Gravity
          import android.view.KeyEvent
          import android.view.MotionEvent
          import android.view.View
          import android.widget.Button
          import android.widget.FrameLayout
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast
          import androidx.activity.ComponentActivity
          import com.swordfish.libretrodroid.GLRetroView
          import com.swordfish.libretrodroid.GLRetroViewData
          import com.swordfish.libretrodroid.ShaderConfig
          import java.io.File

          class MainActivity : ComponentActivity() {
              private val pickRomRequest = 4101
              private val purple = Color.rgb(42, 24, 65)
              private val panel = Color.rgb(67, 46, 91)
              private val accent = Color.rgb(190, 160, 235)
              private lateinit var root: FrameLayout
              private var retroView: GLRetroView? = null
              private var currentRom: File? = null
              private var fastForwardEnabled = false
              private var moveControlsEnabled = false
              private var draggedControlGroup: View? = null
              private var dragDownRawX = 0f
              private var dragDownRawY = 0f
              private var dragStartLeft = 0
              private var dragStartTop = 0
              private var pendingRemapTarget: Int? = null
              private var mappingScreenVisible = false
              private var mappingOverlay: View? = null
              private val controllerMap = mutableMapOf<Int, Int>()
              private val remapActions = linkedMapOf(
                  "Up" to KeyEvent.KEYCODE_DPAD_UP,
                  "Down" to KeyEvent.KEYCODE_DPAD_DOWN,
                  "Left" to KeyEvent.KEYCODE_DPAD_LEFT,
                  "Right" to KeyEvent.KEYCODE_DPAD_RIGHT,
                  "A" to KeyEvent.KEYCODE_BUTTON_A,
                  "B" to KeyEvent.KEYCODE_BUTTON_B,
                  "X" to KeyEvent.KEYCODE_BUTTON_X,
                  "Y" to KeyEvent.KEYCODE_BUTTON_Y,
                  "L" to KeyEvent.KEYCODE_BUTTON_L1,
                  "R" to KeyEvent.KEYCODE_BUTTON_R1,
                  "Start" to KeyEvent.KEYCODE_BUTTON_START,
                  "Select" to KeyEvent.KEYCODE_BUTTON_SELECT
              )

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.statusBarColor = purple
                  window.navigationBarColor = purple
                  loadControllerMap()
                  showLibrary()
              }

              private fun dp(v: Int): Int = (v * resources.displayMetrics.density).toInt()

              private fun showLibrary() {
                  root = FrameLayout(this).apply { setBackgroundColor(purple) }
                  val page = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(18), dp(18), dp(18), dp(18))
                  }
                  val title = TextView(this).apply {
                      text = "SNES POCKET ULTIMATE"
                      textSize = 25f
                      setTextColor(accent)
                      typeface = Typeface.DEFAULT_BOLD
                  }
                  page.addView(title)
                  page.addView(TextView(this).apply {
                      text = "Your Super Nintendo library"
                      textSize = 14f
                      setTextColor(Color.LTGRAY)
                      setPadding(0, dp(4), 0, dp(16))
                  })
                  page.addView(makeButton("＋  IMPORT SNES GAME") { openRomPicker() },
                      LinearLayout.LayoutParams(-1, dp(54)))
                  page.addView(TextView(this).apply {
                      text = "MY GAMES"
                      textSize = 13f
                      setTextColor(accent)
                      typeface = Typeface.DEFAULT_BOLD
                      setPadding(0, dp(20), 0, dp(8))
                  })
                  val list = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  val romDir = File(filesDir, "roms").apply { mkdirs() }
                  val games = romDir.listFiles()?.filter {
                      it.isFile && it.extension.lowercase() in listOf("sfc", "smc", "fig", "swc")
                  }?.sortedBy { it.name.lowercase() } ?: emptyList()
                  if (games.isEmpty()) {
                      list.addView(TextView(this).apply {
                          text = "No games yet. Tap IMPORT SNES GAME and choose a legally obtained .sfc or .smc file."
                          setTextColor(Color.LTGRAY)
                          textSize = 15f
                          setPadding(0, dp(10), 0, dp(10))
                      })
                  } else {
                      games.forEach { game ->
                          list.addView(makeButton("▶   " + game.name) { startGame(game) },
                              LinearLayout.LayoutParams(-1, dp(52)).apply { bottomMargin = dp(7) })
                      }
                  }
                  val scroll = ScrollView(this).apply { addView(list) }
                  page.addView(scroll, LinearLayout.LayoutParams(-1, 0, 1f))
                  root.addView(page)
                  setContentView(root)
              }

              private fun makeButton(label: String, action: () -> Unit): Button =
                  Button(this).apply {
                      text = label
                      isAllCaps = false
                      textSize = 15f
                      setTextColor(Color.WHITE)
                      setBackgroundColor(panel)
                      setOnClickListener { action() }
                  }

              private fun openRomPicker() {
                  val intent = Intent(Intent.ACTION_OPEN_DOCUMENT).apply {
                      addCategory(Intent.CATEGORY_OPENABLE)
                      type = "*/*"
                      putExtra(Intent.EXTRA_MIME_TYPES, arrayOf(
                          "application/octet-stream", "application/x-snes-rom"
                      ))
                  }
                  startActivityForResult(intent, pickRomRequest)
              }

              @Deprecated("Legacy activity result is supported for broad Android compatibility")
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode != pickRomRequest || resultCode != RESULT_OK) return
                  val uri = data?.data ?: return
                  try {
                      val name = displayName(uri).replace(Regex("[^A-Za-z0-9._ -]"), "_")
                      val ext = name.substringAfterLast('.', "").lowercase()
                      if (ext !in listOf("sfc", "smc", "fig", "swc")) {
                          toast("Choose an SNES ROM file (.sfc or .smc).")
                          return
                      }
                      val target = File(File(filesDir, "roms").apply { mkdirs() },
                          name.ifBlank { "game-${System.currentTimeMillis()}.$ext" })
                      contentResolver.openInputStream(uri)?.use { input ->
                          target.outputStream().use { output -> input.copyTo(output) }
                      } ?: throw IllegalStateException("Could not read the selected file")
                      showLibrary()
                      toast("Imported ${target.name}")
                  } catch (e: Exception) {
                      toast("Import failed: ${e.message ?: "unknown error"}")
                  }
              }

              private fun displayName(uri: Uri): String {
                  var name = "game.sfc"
                  val cursor: Cursor? = contentResolver.query(uri, null, null, null, null)
                  cursor?.use {
                      if (it.moveToFirst()) {
                          val index = it.getColumnIndex(OpenableColumns.DISPLAY_NAME)
                          if (index >= 0) name = it.getString(index) ?: name
                      }
                  }
                  return name
              }

              private fun getCoreFile(): File {
                  val allowed = setOf("arm64-v8a", "armeabi-v7a", "x86_64", "x86")
                  val abi = Build.SUPPORTED_ABIS.firstOrNull { it in allowed }
                      ?: throw IllegalStateException("This device CPU architecture is not supported.")
                  val asset = "cores/$abi/snes9x_libretro_android.so"
                  val core = File(File(filesDir, "cores"), "snes9x_libretro_android.so")
                  if (!core.exists() || core.length() == 0L) {
                      core.parentFile?.mkdirs()
                      assets.open(asset).use { input ->
                          core.outputStream().use { output -> input.copyTo(output) }
                      }
                  }
                  return core
              }

              private fun startGame(game: File) {
                  try {
                      val saveDir = File(filesDir, "saves").apply { mkdirs() }
                      val data = GLRetroViewData(this).apply {
                          coreFilePath = getCoreFile().absolutePath
                          gameFilePath = game.absolutePath
                          systemDirectory = File(filesDir, "system").apply { mkdirs() }.absolutePath
                          savesDirectory = saveDir.absolutePath
                          shader = ShaderConfig.Default
                          preferLowLatencyAudio = true
                      }
                      currentRom = game
                      fastForwardEnabled = false
                      root = FrameLayout(this).apply {
                      setBackgroundColor(Color.BLACK)
                      setMotionEventSplittingEnabled(true)
                  }
                      val view = GLRetroView(this, data)
                      retroView = view
                      lifecycle.addObserver(view)
                      root.addView(view, FrameLayout.LayoutParams(-1, -1))
                      addOverlayControls()
                      setContentView(root)
                  } catch (e: Exception) {
                      toast("Could not start game: ${e.message ?: "check core download"}")
                      showLibrary()
                  }
              }

              private fun addOverlayControls() {
                  val top = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setBackgroundColor(0x882A1841.toInt())
                  }
                  top.addView(makeButton("‹ Library") { exitGame() })
                  top.addView(makeButton("Map") { showRemapDialog() })
                  top.addView(makeButton("Move") {
                      moveControlsEnabled = !moveControlsEnabled
                      toast(if (moveControlsEnabled) "Move mode ON: drag a control group from its open area. Tap Move again when finished." else "Move mode OFF")
                  })
                  top.addView(makeButton("Save") { saveState() })
                  top.addView(makeButton("Load") { loadState() })
                  lateinit var ffButton: Button
                  ffButton = makeButton("FF 1×") {
                      fastForwardEnabled = !fastForwardEnabled
                      retroView?.frameSpeed = if (fastForwardEnabled) 3 else 1
                      ffButton.text = if (fastForwardEnabled) "FF 3×" else "FF 1×"
                  }
                  top.addView(ffButton)
                  root.addView(top, FrameLayout.LayoutParams(-1, dp(48), Gravity.TOP))

                  // SNES9x-inspired arrangement: shoulder buttons high, D-pad left,
                  // ABXY diamond on the right, and Start/Select near the bottom center.
                  root.addView(control("L", KeyEvent.KEYCODE_BUTTON_L1, 76, true, 44).apply { tag = "snes-left-shoulder" },
                      FrameLayout.LayoutParams(dp(76), dp(44), Gravity.TOP or Gravity.LEFT).apply {
                          leftMargin = dp(12)
                          topMargin = dp(52)
                      })
                  root.addView(control("R", KeyEvent.KEYCODE_BUTTON_R1, 76, true, 44).apply { tag = "snes-right-shoulder" },
                      FrameLayout.LayoutParams(dp(76), dp(44), Gravity.TOP or Gravity.RIGHT).apply {
                          rightMargin = dp(12)
                          topMargin = dp(52)
                      })

                  val dpad = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                  }
                  val dpadTop = LinearLayout(this).apply { gravity = Gravity.CENTER }
                  dpadTop.addView(control("▲", KeyEvent.KEYCODE_DPAD_UP, 58))
                  val dpadMiddle = LinearLayout(this).apply { gravity = Gravity.CENTER }
                  dpadMiddle.addView(control("◀", KeyEvent.KEYCODE_DPAD_LEFT, 58))
                  dpadMiddle.addView(control("", -1, 58, false))
                  dpadMiddle.addView(control("▶", KeyEvent.KEYCODE_DPAD_RIGHT, 58))
                  val dpadBottom = LinearLayout(this).apply { gravity = Gravity.CENTER }
                  dpadBottom.addView(control("▼", KeyEvent.KEYCODE_DPAD_DOWN, 58))
                  dpad.addView(dpadTop)
                  dpad.addView(dpadMiddle)
                  dpad.addView(dpadBottom)
                  root.addView(dpad, FrameLayout.LayoutParams(-2, -2, Gravity.BOTTOM or Gravity.LEFT).apply {
                      leftMargin = dp(12)
                      bottomMargin = dp(12)
                  })
                  makeGroupMovable(dpad)

                  val face = FrameLayout(this)
                  face.addView(control("X", KeyEvent.KEYCODE_BUTTON_X, 58),
                      FrameLayout.LayoutParams(dp(58), dp(58), Gravity.TOP or Gravity.CENTER_HORIZONTAL))
                  face.addView(control("Y", KeyEvent.KEYCODE_BUTTON_Y, 58),
                      FrameLayout.LayoutParams(dp(58), dp(58), Gravity.CENTER_VERTICAL or Gravity.LEFT))
                  face.addView(control("A", KeyEvent.KEYCODE_BUTTON_A, 58),
                      FrameLayout.LayoutParams(dp(58), dp(58), Gravity.CENTER_VERTICAL or Gravity.RIGHT))
                  face.addView(control("B", KeyEvent.KEYCODE_BUTTON_B, 58),
                      FrameLayout.LayoutParams(dp(58), dp(58), Gravity.BOTTOM or Gravity.CENTER_HORIZONTAL))
                  root.addView(face, FrameLayout.LayoutParams(dp(190), dp(190), Gravity.BOTTOM or Gravity.RIGHT).apply {
                      rightMargin = dp(12)
                      bottomMargin = dp(12)
                  })
                  makeGroupMovable(face)

                  val startSelect = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER
                  }
                  startSelect.addView(control("SELECT", KeyEvent.KEYCODE_BUTTON_SELECT, 78, true, 42))
                  startSelect.addView(control("START", KeyEvent.KEYCODE_BUTTON_START, 78, true, 42))
                  root.addView(startSelect, FrameLayout.LayoutParams(-2, dp(48), Gravity.BOTTOM or Gravity.CENTER_HORIZONTAL).apply {
                      bottomMargin = dp(12)
                  })
                  makeGroupMovable(startSelect)
                  root.findViewWithTag<View>("snes-left-shoulder")?.let { makeGroupMovable(it) }
                  root.findViewWithTag<View>("snes-right-shoulder")?.let { makeGroupMovable(it) }
              }

              private fun control(
                  label: String,
                  key: Int,
                  widthDp: Int = 60,
                  enabled: Boolean = true,
                  heightDp: Int = widthDp
              ): TextView = TextView(this).apply {
                  text = label
                  textSize = when {
                      label.length > 3 -> 10f
                      label.length > 1 -> 15f
                      else -> 22f
                  }
                  gravity = Gravity.CENTER
                  setTextColor(if (enabled) Color.WHITE else Color.TRANSPARENT)
                  setBackgroundColor(if (enabled) panel else Color.TRANSPARENT)
                  isClickable = enabled
                  isFocusable = false
                  elevation = if (enabled) dp(3).toFloat() else 0f
                  val lp = LinearLayout.LayoutParams(dp(widthDp), dp(heightDp))
                  lp.setMargins(dp(3), dp(3), dp(3), dp(3))
                  layoutParams = lp
                  if (enabled) setOnTouchListener { view, event ->
                      val v = retroView
                      if (moveControlsEnabled) return@setOnTouchListener handleMoveTouch(view, event)
                      when (event.actionMasked) {
                          MotionEvent.ACTION_DOWN -> {
                              view.setBackgroundColor(Color.rgb(125, 88, 165))
                              if (v != null) v.sendKeyEvent(KeyEvent.ACTION_DOWN, key)
                          }
                          MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> {
                              view.setBackgroundColor(panel)
                              if (v != null) v.sendKeyEvent(KeyEvent.ACTION_UP, key)
                          }
                      }
                      true
                  }
              }

              // In Move mode, dragging any button moves its whole control group.
              // Touching controls outside Move mode remains dedicated to gameplay.
              private fun handleMoveTouch(touchedView: View, event: MotionEvent): Boolean {
                  var group = touchedView
                  while (group.parent is View && group.parent !== root) {
                      group = group.parent as View
                  }
                  val lp = group.layoutParams as? FrameLayout.LayoutParams ?: return true
                  when (event.actionMasked) {
                      MotionEvent.ACTION_DOWN -> {
                          draggedControlGroup = group
                          dragDownRawX = event.rawX
                          dragDownRawY = event.rawY
                          val location = IntArray(2)
                          val rootLocation = IntArray(2)
                          group.getLocationOnScreen(location)
                          root.getLocationOnScreen(rootLocation)
                          lp.gravity = Gravity.TOP or Gravity.LEFT
                          lp.leftMargin = location[0] - rootLocation[0]
                          lp.topMargin = location[1] - rootLocation[1]
                          lp.rightMargin = 0
                          lp.bottomMargin = 0
                          group.layoutParams = lp
                          dragStartLeft = lp.leftMargin
                          dragStartTop = lp.topMargin
                      }
                      MotionEvent.ACTION_MOVE -> {
                          if (draggedControlGroup === group) {
                              lp.leftMargin = (dragStartLeft + event.rawX - dragDownRawX).toInt()
                                  .coerceIn(0, (root.width - group.width).coerceAtLeast(0))
                              lp.topMargin = (dragStartTop + event.rawY - dragDownRawY).toInt()
                                  .coerceIn(0, (root.height - group.height).coerceAtLeast(0))
                              group.layoutParams = lp
                          }
                      }
                      MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> {
                          draggedControlGroup = null
                      }
                  }
                  return true
              }

              private fun makeGroupMovable(group: View) {
                  var downRawX = 0f
                  var downRawY = 0f
                  var startX = 0
                  var startY = 0
                  group.setOnTouchListener { view, event ->
                      if (!moveControlsEnabled) return@setOnTouchListener false
                      val lp = view.layoutParams as? FrameLayout.LayoutParams
                          ?: return@setOnTouchListener false
                      when (event.actionMasked) {
                          MotionEvent.ACTION_DOWN -> {
                              downRawX = event.rawX
                              downRawY = event.rawY
                              startX = lp.leftMargin
                              startY = lp.topMargin
                              // Convert gravity-anchored layout to top-left positioning for dragging.
                              val location = IntArray(2)
                              val rootLocation = IntArray(2)
                              view.getLocationOnScreen(location)
                              root.getLocationOnScreen(rootLocation)
                              lp.gravity = Gravity.TOP or Gravity.LEFT
                              lp.leftMargin = location[0] - rootLocation[0]
                              lp.topMargin = location[1] - rootLocation[1]
                              view.layoutParams = lp
                              startX = lp.leftMargin
                              startY = lp.topMargin
                              true
                          }
                          MotionEvent.ACTION_MOVE -> {
                              lp.leftMargin = (startX + event.rawX - downRawX).toInt().coerceIn(0, (root.width - view.width).coerceAtLeast(0))
                              lp.topMargin = (startY + event.rawY - downRawY).toInt().coerceIn(0, (root.height - view.height).coerceAtLeast(0))
                              lp.rightMargin = 0
                              lp.bottomMargin = 0
                              view.layoutParams = lp
                              true
                          }
                          MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> {
                              view.performClick()
                              true
                          }
                          else -> true
                      }
                  }
              }

              private fun saveState() {
                  val view = retroView ?: return
                  val game = currentRom ?: return
                  try {
                      File(filesDir, "saves/${game.name}.state").writeBytes(view.serializeState())
                      toast("Save state created")
                  } catch (e: Exception) {
                      toast("Save failed: ${e.message}")
                  }
              }

              private fun loadState() {
                  val view = retroView ?: return
                  val game = currentRom ?: return
                  val file = File(filesDir, "saves/${game.name}.state")
                  if (!file.exists()) { toast("No save state for this game yet"); return }
                  try {
                      if (view.unserializeState(file.readBytes())) toast("Save state loaded")
                      else toast("This save state could not be loaded")
                  } catch (e: Exception) {
                      toast("Load failed: ${e.message}")
                  }
              }

              private fun exitGame() {
                  fastForwardEnabled = false
                  val view = retroView
                  if (view != null) {
                      try { view.onPause() } catch (_: Exception) {}
                      try { lifecycle.removeObserver(view) } catch (_: Exception) {}
                      try { view.onDestroy() } catch (_: Exception) {}
                  }
                  retroView = null
                  currentRom = null
                  showLibrary()
              }

              private fun loadControllerMap() {
                  val saved = getSharedPreferences("controller-map", MODE_PRIVATE).all
                  controllerMap.clear()
                  saved.forEach { (physical, target) ->
                      val p = physical.toIntOrNull()
                      val t = target as? Int
                      if (p != null && t != null) controllerMap[p] = t
                  }
              }

              private fun saveControllerMap() {
                  val editor = getSharedPreferences("controller-map", MODE_PRIVATE).edit().clear()
                  controllerMap.forEach { (physical, target) -> editor.putInt(physical.toString(), target) }
                  editor.apply()
              }

              private fun showRemapDialog() {
                  if (mappingOverlay != null) return
                  mappingScreenVisible = true
                  pendingRemapTarget = null
                  val overlay = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(18), dp(18), dp(18), dp(18))
                      setBackgroundColor(Color.rgb(30, 20, 43))
                      isFocusableInTouchMode = true
                  }
                  mappingOverlay = overlay
                  overlay.addView(TextView(this).apply {
                      text = "CONTROLLER BUTTON MAPPING"
                      textSize = 22f
                      typeface = Typeface.DEFAULT_BOLD
                      setTextColor(accent)
                      setPadding(0, 0, 0, dp(8))
                  })
                  val status = TextView(this).apply {
                      text = "Choose a control below. Then press the physical G60S Pro button you want to assign."
                      textSize = 15f
                      setTextColor(Color.WHITE)
                      setPadding(0, 0, 0, dp(10))
                  }
                  overlay.addView(status)
                  val list = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  remapActions.keys.toList().chunked(2).forEach { rowNames ->
                      val row = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                      rowNames.forEach { name ->
                          val target = remapActions[name]!!
                          val button = makeButton(name) {
                              pendingRemapTarget = target
                              status.text = "Now press the G60S Pro button for: $name"
                              toast("Press the physical button for $name")
                          }
                          row.addView(button, LinearLayout.LayoutParams(0, dp(48), 1f).apply {
                              setMargins(dp(4), dp(4), dp(4), dp(4))
                          })
                      }
                      list.addView(row)
                  }
                  overlay.addView(ScrollView(this).apply { addView(list) },
                      LinearLayout.LayoutParams(-1, 0, 1f))
                  val bottom = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                  bottom.addView(makeButton("Reset mappings") {
                      controllerMap.clear()
                      saveControllerMap()
                      status.text = "Mappings reset. Choose a control, then press a controller button."
                  }, LinearLayout.LayoutParams(0, dp(48), 1f))
                  bottom.addView(makeButton("Done") { closeRemapScreen() },
                      LinearLayout.LayoutParams(0, dp(48), 1f))
                  overlay.addView(bottom)
                  root.addView(overlay, FrameLayout.LayoutParams(-1, -1))
                  overlay.requestFocus()
              }

              private fun closeRemapScreen() {
                  mappingOverlay?.let { root.removeView(it) }
                  mappingOverlay = null
                  mappingScreenVisible = false
                  pendingRemapTarget = null
              }

              private val capturedRemapKeys = mutableSetOf<Int>()

              override fun dispatchKeyEvent(event: KeyEvent): Boolean {
                  val keyCode = event.keyCode
                  val view = retroView
                  if (mappingScreenVisible) {
                      if (pendingRemapTarget != null && event.action == KeyEvent.ACTION_DOWN &&
                          keyCode != KeyEvent.KEYCODE_BACK) {
                          val target = pendingRemapTarget!!
                          controllerMap[keyCode] = target
                          pendingRemapTarget = null
                          capturedRemapKeys.add(keyCode)
                          saveControllerMap()
                          val label = remapActions.entries.firstOrNull { it.value == target }?.key ?: "button"
                          (mappingOverlay as? LinearLayout)?.let { overlay ->
                              (overlay.getChildAt(1) as? TextView)?.text =
                                  "$label mapped. Choose another control or press Done."
                          }
                          toast("$label mapped")
                          return true
                      }
                      if (event.action == KeyEvent.ACTION_UP && capturedRemapKeys.remove(keyCode)) return true
                      if (keyCode == KeyEvent.KEYCODE_BACK && event.action == KeyEvent.ACTION_UP) {
                          closeRemapScreen()
                          return true
                      }
                      // Allow TV remote navigation to operate the visible mapping list.
                      return super.dispatchKeyEvent(event)
                  }
                  if (view != null && keyCode != KeyEvent.KEYCODE_BACK) {
                      view.sendKeyEvent(event.action, controllerMap[keyCode] ?: keyCode)
                      return true
                  }
                  return super.dispatchKeyEvent(event)
              }

              override fun onKeyDown(keyCode: Int, event: KeyEvent): Boolean {
                  return super.onKeyDown(keyCode, event)
              }

              override fun onKeyUp(keyCode: Int, event: KeyEvent): Boolean {
                  return super.onKeyUp(keyCode, event)
              }

              override fun onGenericMotionEvent(event: MotionEvent): Boolean {
                  val view = retroView
                  if (view != null) {
                      view.onGenericMotionEvent(event)
                      return true
                  }
                  return super.onGenericMotionEvent(event)
              }

              @Deprecated("Deprecated in Android API")
              override fun onBackPressed() {
                  if (retroView != null) exitGame() else super.onBackPressed()
              }

              private fun toast(message: String) =
                  Toast.makeText(this, message, Toast.LENGTH_LONG).show()
          }
          KOTLIN

          # Download official Libretro buildbot SNES9x cores for common Android ABIs.
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            mkdir -p "$PROJECT_DIR/app/src/main/assets/cores/$abi"
            url="https://buildbot.libretro.com/nightly/android/latest/$abi/snes9x_libretro_android.so.zip"
            echo "Downloading SNES9x core for $abi"
            curl --fail --location --retry 3 "$url" -o "/tmp/snes9x-$abi.zip"
            unzip -o "/tmp/snes9x-$abi.zip" -d "$PROJECT_DIR/app/src/main/assets/cores/$abi"
            test -s "$PROJECT_DIR/app/src/main/assets/cores/$abi/snes9x_libretro_android.so"
          done

          echo "LibretroDroid dependency, SNES9x cores, ROM import, touch/gamepad controls and save states prepared."

      # Step 7: Build the debug APK
      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug

      # Step 8: Upload the APK for download
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SNES-Pocket-Android-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
