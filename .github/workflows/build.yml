name: Build APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q -o SNESPocket-Android-Project.zip -d project
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build
        run: |
          DIR=$(dirname "$(find project -name settings.gradle.kts | head -1)")
          gradle -p "$DIR" assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: SNESAndroidPocket
          path: project/**/build/outputs/apk/debug/SNESAndroidPocket.apk
