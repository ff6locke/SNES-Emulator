name: Build SNES Pocket Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "SNESPocket-Android-Project.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Android project
        run: |
          mkdir -p extracted
          unzip -o SNESPocket-Android-Project.zip -d extracted

          PROJECT_DIR="$(find extracted -name settings.gradle.kts -printf '%h\n' | head -n 1)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Could not find settings.gradle.kts in the ZIP."
            echo "ZIP contents:"
            unzip -l SNESPocket-Android-Project.zip
            exit 1
          fi

          echo "Project found at: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SNES-Pocket-Android-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Save extracted source files
        run: |
          mkdir -p source-files
          cp -a "$PROJECT_DIR"/. source-files/

          if [ -f README.md ]; then
            echo "README already exists."
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add source-files/

          if ! git diff --cached --quiet; then
            git commit -m "Add extracted Android project source files"
            git push
          else
            echo "No new source files to commit."
          If
