name: Unzip and Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Extract Project ZIP
      run: unzip SNESPocket-Android-Project.zip -d . 

    - name: Find Root Project Directory
      id: find_dir
      run: |
        SETTINGS_FILE=$(find . -name "settings.gradle" -o -name "settings.gradle.kts" | head -n 1)
        if [ -z "$SETTINGS_FILE" ]; then
          echo "ERROR: Could not find settings.gradle in the ZIP!"
          exit 1
        fi
        GRADLE_ROOT=$(dirname "$SETTINGS_FILE")
        echo "PROJECT_DIR=$GRADLE_ROOT" >> $GITHUB_ENV
        echo "Found True Android Root at: $GRADLE_ROOT"

    # --- UPDATED TO JDK 17 ---
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Upgrade or Create Gradle Wrapper to 8.9
      run: |
        cd ${{ env.PROJECT_DIR }}
        gradle wrapper --gradle-version 8.9 --distribution-type all

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Grant Execute Permission to Gradlew
      run: chmod +x ${{ env.PROJECT_DIR }}/gradlew

    - name: Build Debug APK
      run: |
        cd ${{ env.PROJECT_DIR }}
        # --- NEW FLAG APPIED HERE TO OVERRIDE THE JVM DISCREPANCY ---
        ./gradlew assembleDebug -Pkotlin.jvm.target.validation.mode=ignore

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        path: "**/build/outputs/apk/debug/*.apk"
