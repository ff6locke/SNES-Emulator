name: Unzip and Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Extract Project ZIP
      run: unzip SNESPocket-Android-Project.zip -d . 

    # --- AUTOMATICALLY FIND AND SAVE THE CORRECT DIRECTORY ---
    - name: Find Project Directory
      id: find_dir
      run: |
        # Search for the folder containing gradlew and save it
        GRADLE_DIR=$(dirname $(find . -name gradlew | head -n 1))
        echo "PROJECT_DIR=$GRADLE_DIR" >> $GITHUB_ENV
        echo "Found Android project at: $GRADLE_DIR"

    - name: Upgrade Gradle Wrapper to 8.9
      run: |
        cd ${{ env.PROJECT_DIR }}
        ./gradlew wrapper --gradle-version 8.9 --distribution-type all

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Grant Execute Permission to Gradlew
      run: chmod +x ${{ env.PROJECT_DIR }}/gradlew

    - name: Build Debug APK
      run: |
        cd ${{ env.PROJECT_DIR }}
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        path: "**/build/outputs/apk/debug/*.apk"
